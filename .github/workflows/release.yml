name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
            name: mac
            glob: release/*.dmg
          - os: windows-latest
            flag: --win
            name: win
            glob: release/*.exe
          - os: ubuntu-latest
            flag: --linux
            name: linux
            glob: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build (Windows, Linux)
        if: matrix.name != 'mac'
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # macOS: Developer ID signing and notarization when the secrets exist,
      # otherwise an ad-hoc signed build so forks and tests stay green.
      - name: Build (macOS)
        if: matrix.name == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "Signing with Developer ID and notarizing."
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            unset APPLE_API_KEY_P8
            npx electron-builder --mac --publish never
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets. Building an ad-hoc signed app."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never \
              -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false -c.dmg.sign=false
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      # electron-builder notarizes the .app. The signed .dmg is notarized and
      # stapled here so it also opens offline without a warning.
      - name: Notarize and staple dmg (macOS)
        if: matrix.name == 'mac' && env.SIGNED == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Verify (macOS)
        if: matrix.name == 'mac'
        run: |
          for app in release/mac*/Glyphbooth.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          if [ "$SIGNED" = "true" ]; then
            for dmg in release/*.dmg; do
              xcrun stapler validate "$dmg"
              spctl -a -vvv -t install "$dmg"
            done
          fi
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: glyphbooth-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
          generate_release_notes: true
